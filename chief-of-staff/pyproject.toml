[project]
name = "chief-of-staff"
version = "0.1.0"
description = "A personal AI chief of staff. Drafts, never sends."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "msal>=1.31",
    "rich>=13.7",
]

[project.scripts]
cos = "cos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
